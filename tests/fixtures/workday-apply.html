<!DOCTYPE html>
<html lang="en">
  <head><meta charset="utf-8" /><title>Workday fixture</title></head>
  <body>
    <div data-automation-id="applyFlow">
      <form>
        <div data-automation-id="formField-legalName">
          <label for="legalName--firstName">First Name</label>
          <input id="legalName--firstName" data-automation-id="legalName--firstName" required />
        </div>
        <div data-automation-id="formField-legalName">
          <label for="legalName--lastName">Last Name</label>
          <input id="legalName--lastName" data-automation-id="legalName--lastName" required />
        </div>
        <div>
          <label for="email">Email Address</label>
          <input id="email" type="email" required />
        </div>
        <div>
          <label for="phone">Phone Number</label>
          <input id="phone" type="tel" />
        </div>
        <div>
          <label for="country">Country</label>
          <select id="country">
            <option value="">Select One</option>
            <option>United States of America</option>
            <option>Canada</option>
            <option>United Kingdom</option>
          </select>
        </div>
        <div>
          <label for="city">City</label>
          <input id="city" />
        </div>
        <div>
          <label for="howHeard">How Did You Hear About Us?</label>
          <select id="howHeard">
            <option value="">Select One</option>
            <option>LinkedIn</option>
            <option>Company Website</option>
            <option>Referral</option>
          </select>
        </div>
      </form>
    </div>
  </body>
</html>
