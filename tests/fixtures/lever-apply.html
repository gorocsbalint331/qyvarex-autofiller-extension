<!DOCTYPE html>
<html lang="en">
  <head><meta charset="utf-8" /><title>Lever fixture</title></head>
  <body>
    <form class="application-form" id="application-form">
      <div class="application-question">
        <label for="name">Full name*</label>
        <input id="name" name="name" required />
      </div>
      <div class="application-question">
        <label for="email">Email*</label>
        <input id="email" name="email" type="email" required />
      </div>
      <div class="application-question">
        <label for="phone">Phone</label>
        <input id="phone" name="phone" />
      </div>
      <div class="application-question">
        <label for="org">Current company</label>
        <input id="org" name="org" />
      </div>
      <div class="application-question">
        <label for="urls-linkedin">LinkedIn URL</label>
        <input id="urls-linkedin" name="urls[LinkedIn]" />
      </div>
      <div class="application-question">
        <label for="additional">Additional information</label>
        <textarea id="additional" name="comments"></textarea>
      </div>
      <div class="application-question">
        <label for="location">Location</label>
        <select id="location" name="location">
          <option value="">Select…</option>
          <option>San Francisco</option>
          <option>New York</option>
          <option>Remote</option>
        </select>
      </div>
      <button type="submit">Submit application</button>
    </form>
  </body>
</html>
